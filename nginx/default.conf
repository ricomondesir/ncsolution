# nginx/default.conf

upstream webapp {
    server web:8000;
}

server {
    listen 80;
    #server_name localhost;

    # The location of the static files collected by Django. This path must match the volume mount in docker-compose.yml. 
    location /static/ {
        alias /usr/src/app/static_collected/;
    }


    # Redirect all other requests to the Gunicorn container.
    location / {
        proxy_pass http://webapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}